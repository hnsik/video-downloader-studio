name: Build Windows installer

on:
  push:
    branches: [main, "update/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза (например v6.0.0-rc1); пусто — только собрать артефакт"
        required: false
        default: ""

env:
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Fetch bundled components (yt-dlp, Deno, FFmpeg)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_bundled.py bundled
      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm installer/VideoDownloaderStudio.spec
      - name: Smoke-test frozen build
        shell: pwsh
        run: |
          Test-Path dist/VideoDownloaderStudio/VideoDownloaderStudio.exe
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/VideoDownloaderStudio/VideoDownloaderStudio.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Приложение завершилось сразу после запуска (код $($p.ExitCode))" }
          Stop-Process $p -Force
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path vds/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer/VideoDownloaderStudio.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloaderStudio-Update-Windows-x64-Setup
          path: dist-installer/VideoDownloaderStudio-Update-Windows-x64-Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          name: Video Downloader Studio ${{ inputs.release_tag || github.ref_name }}
          files: dist-installer/VideoDownloaderStudio-Update-Windows-x64-Setup.exe
